<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061421">
<title>Flash Report SSMA</title>
<style>
:root{--bg:#061421;--panel:#0a2132;--line:#ffffff18;--blue:#147fbe;--blue2:#0b6aa5;--red:#f31318;--green:#159447;--text:#eef9ff;--muted:#9fc2d6;--r:18px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden;font-family:"Century Gothic",Arial,sans-serif;background:radial-gradient(circle at 12% 0,#124365,#061421 48%,#030911);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:380px minmax(0,1fr)}.sidebar{height:100vh;position:sticky;top:0;overflow:auto;padding:18px;background:linear-gradient(180deg,#0b2639,#061523);border-right:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:12px}.mark{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--red),#ff595d);display:grid;place-items:center;font-weight:900;box-shadow:0 12px 24px #0007}h1{font-size:18px;margin:0}.brand p,.mini{font-size:11px;color:var(--muted);line-height:1.35;margin:4px 0 0}.steps{display:flex;gap:7px;margin:10px 0 14px;position:sticky;top:0;background:#071725cc;backdrop-filter:blur(10px);padding:8px 0;z-index:10}.dot{flex:1;height:8px;border-radius:99px;background:#ffffff1b}.dot.on{background:linear-gradient(90deg,var(--red),#ff5558)}.panel{background:#ffffff0b;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 14px 28px #0004}.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.16em;margin:0 0 12px;color:#d7f2ff;display:flex;justify-content:space-between;gap:8px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}label{font-size:12px;color:#c6deea}input,select,textarea{width:100%;border:1px solid #ffffff20;border-radius:14px;background:#051421;color:var(--text);outline:0;padding:11px 12px;font-size:16px}input[type=date]{color-scheme:dark}input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1) brightness(1.2);opacity:1}textarea{min-height:98px;resize:vertical;line-height:1.35}input:focus,select:focus,textarea:focus,.thumb:focus-visible,.btn:focus-visible{border-color:#38adee;box-shadow:0 0 0 3px #1592d633;outline:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{position:relative;display:block;cursor:pointer}.choice input{position:absolute;opacity:0}.choice span{display:flex;align-items:center;justify-content:center;min-height:42px;padding:9px;border-radius:14px;background:#071a28;border:1px solid #ffffff18;font-size:12px;font-weight:800;text-align:center}.choice input:checked+span{background:linear-gradient(135deg,var(--red),#a90c10);border-color:#ff8386;color:#fff}.btns,.aiBox{display:grid;gap:9px}.btn{border:0;border-radius:15px;padding:12px 14px;min-height:46px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 10px 18px #0004}.btn.dark{background:#102d42;border:1px solid #ffffff1a}.btn.red{background:linear-gradient(135deg,#f31318,#a90c10)}.btn.green{background:linear-gradient(135deg,#17a34a,#15803d)}.btn:disabled{opacity:.45;pointer-events:none}.main{min-width:0;padding:18px;display:grid;grid-template-rows:auto 1fr;gap:14px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#ffffff0b;border:1px solid var(--line);border-radius:22px;padding:14px 16px}.topbar strong{font-size:18px}.topbar span{font-size:12px;color:var(--muted)}.previewWrap{overflow:auto;display:grid;place-items:start center;padding:8px 0 110px}.pageShell{width:min(100%,790px);aspect-ratio:1638/2048;position:relative;filter:drop-shadow(0 30px 60px #000a)}#report{position:relative;width:100%;height:100%;overflow:hidden;background:#06446b;border-radius:4px;user-select:none}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.logo{position:absolute;right:8.5%;bottom:4.35%;width:17.7%;height:auto}.selo{position:absolute;left:6.9%;top:5.55%;width:43.2%;height:auto}.headerForm{position:absolute;left:56.8%;right:3.9%;top:2.2%;display:flex;flex-direction:column;gap:.18cqw;color:#fff;font-size:.78cqw;z-index:4}.headRow{display:flex;align-items:center;gap:.34cqw;min-height:.9cqw}.headRow .label{white-space:nowrap;text-shadow:0 1px 2px #002c4d}.headBox{height:.86cqw;min-width:6.5cqw;max-width:100%;border-radius:.18cqw;background:#1886c8;display:inline-flex;align-items:center;padding:0 .42cqw;overflow:hidden;white-space:nowrap;text-shadow:0 1px 1px #00476d}.slotLayer{position:absolute;inset:0}.slot{position:absolute;background:#eef4f7;border-radius:16px;overflow:hidden;box-shadow:0 14px 28px #00182955;outline:0 solid transparent;cursor:grab;touch-action:none}.slot.active{outline:4px solid var(--red);box-shadow:0 0 0 7px white,0 18px 34px #0008}.slot img{position:absolute;left:0;top:0;width:auto;height:auto;max-width:none;max-height:none;pointer-events:none;transform:none}.slot .hint{position:absolute;inset:0;display:grid;place-items:center;color:#95a9b4;font-weight:900;font-size:clamp(10px,1.35cqw,18px)}.num{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;border-radius:999px;width:28px;height:28px;display:grid;place-items:center;font-size:12px;font-weight:900;z-index:2}.descBox{position:absolute;left:7.2%;top:84.58%;width:64%;height:10.2%;display:none;border-radius:1.15cqw;background:#0d75ade6;padding:.95cqw 1.25cqw;color:#fff;font-size:1.05cqw;line-height:1.16;overflow:hidden;overflow-wrap:anywhere;word-break:break-word;text-shadow:0 1px 2px #003553}.barLine{position:absolute;left:6.4%;right:7.2%;bottom:2.42%;height:.45%;background:#1179b2;border-radius:99px}.barLine:before{content:"";display:block;width:5.1%;height:100%;background:var(--red);border-radius:99px}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.thumb{height:62px;border-radius:13px;background:#061623;overflow:hidden;position:relative;border:1px solid #ffffff1a;color:#fff;padding:0}.thumb img{width:100%;height:100%;object-fit:cover}.thumb.active{outline:2px solid var(--red)}.thumbMain{position:absolute;inset:0;border:0;background:transparent}.thumbNum,.thumbRemove{position:absolute;z-index:2;border:0;border-radius:999px;color:#fff;font-weight:900;display:grid;place-items:center}.thumbNum{top:6px;left:6px;width:24px;height:24px;background:var(--red);font-size:11px}.thumbRemove{top:6px;right:6px;width:24px;height:24px;background:#03111dcc;font-size:15px}.thumb .hint{height:100%;display:grid;place-items:center;color:#9fc2d6;font-weight:900;font-size:13px;text-align:center}.thumbLabel{position:absolute;left:6px;right:6px;bottom:6px;font-size:10px;color:#d7effb;background:#03111dbb;padding:4px;border-radius:8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thumbActions{display:grid;gap:8px;margin-top:8px}.rangeLine{display:grid;grid-template-columns:66px 1fr 46px;align-items:center;gap:8px;margin:8px 0;font-size:12px;color:#c6deea}input[type=range]{padding:0;accent-color:#1598df}.empty,.waPreview{border:1px dashed #ffffff33;border-radius:14px;background:#061623;color:#95b6c8;padding:11px;font-size:12px;line-height:1.35}.waPreview{white-space:pre-line;min-height:120px;border-style:solid}.waActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.warnList{display:grid;gap:8px}.warn{border-radius:14px;padding:10px 11px;background:#071b2a;border:1px solid #ffffff18;color:#d8edf8;font-size:12px}.warn.bad{border-color:#f3131844;background:#2a0710}.warn.ok{border-color:#22c55e55;background:#062817}.downloadBox{display:none;margin-top:10px;padding:12px;background:#020f18;border:1px solid #1b6c95;border-radius:16px}.downloadBox.on{display:block}.downloadBox img{width:100%;border-radius:12px;margin-bottom:10px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:#03111d;color:#fff;border:1px solid #ffffff22;border-radius:999px;padding:11px 16px;box-shadow:0 14px 28px #0008;z-index:50;transition:.2s}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}.mobileBar{display:none}.srOnly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative;padding:13px 13px 0;border-right:0}.main{padding:12px}.topbar{display:none}.pageShell{width:min(100%,560px)}.headerForm{font-size:.96cqw;left:55.5%;right:4%;top:2.45%}.headBox{height:.98cqw}.descBox{font-size:1.52cqw;height:10.8%;padding:1.15cqw 1.35cqw}.panel{display:none;margin-bottom:82px}.panel.active{display:block}.mobileBar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1.1fr 1.3fr;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#061421ef;backdrop-filter:blur(12px);border-top:1px solid #ffffff18;z-index:40}.mobileBar .btn{min-height:48px;padding:10px 8px}}@media(max-width:560px){.row,.choiceGrid{grid-template-columns:1fr}.main{padding:9px}.pageShell{width:100%}.slot.active{outline-width:3px}.num{width:23px;height:23px;font-size:10px;top:7px;left:7px}.btn{font-size:13px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="mark">FR</div><div><h1>Flash Report SSMA</h1><p>Editor de Reports de SSMA e Qualidade</p></div></div>
 <div class="steps" id="steps"></div>
 <section class="panel" data-step="0"><h2>1. Dados</h2>
  <div class="field"><label>Tipo de obra</label><div class="choiceGrid" id="tipoObraWrap">
   <label class="choice"><input type="radio" name="tipoObra" value="privada" checked><span>Obra privada</span></label>
   <label class="choice"><input type="radio" name="tipoObra" value="publica"><span>Obra pública</span></label>
  </div></div>
  <div class="field"><label>Obra</label><input id="obra" autocomplete="off"></div>
  <div class="field"><label>Responsável</label><input id="resp" autocomplete="off"></div>
  <div class="field"><label>Data</label><input id="data" type="date"></div>
  <div class="field"><label>Gestor do Contrato</label><input id="gestorContrato" autocomplete="off"></div>
  <div class="field" data-private-only><label>Gestor Vale</label><input id="gestorVale" autocomplete="off"></div>
  <div class="field" data-private-only><label>Coordenação Vale</label><input id="coordVale" autocomplete="off"></div>
  <div class="field" data-private-only><label>Gerência</label><input id="gerencia" autocomplete="off"></div>
  <div class="field"><label>Tipo de ação</label><div class="choiceGrid" id="tipoAcaoWrap">
   <label class="choice"><input type="radio" name="tipoAcao" value="AÇÃO"><span>AÇÃO</span></label>
   <label class="choice"><input type="radio" name="tipoAcao" value="CAMPANHA"><span>CAMPANHA</span></label>
   <label class="choice"><input type="radio" name="tipoAcao" value="DSS / DSS ESPECIAL" checked><span>DSS / DSS ESPECIAL</span></label>
   <label class="choice"><input type="radio" name="tipoAcao" value="TREINAMENTO"><span>TREINAMENTO</span></label>
   <label class="choice"><input type="radio" name="tipoAcao" value="QUARTA SEGURA"><span>QUARTA SEGURA</span></label>
   <label class="choice"><input type="radio" name="tipoAcao" value="AUDITORIA"><span>AUDITORIA</span></label>
   <label class="choice"><input type="radio" name="tipoAcao" value="INSPEÇÃO"><span>INSPEÇÃO</span></label>
   <label class="choice"><input type="radio" name="tipoAcao" value="DQS"><span>DQS</span></label>
  </div></div>
 </section>
 <section class="panel" data-step="1"><h2>2. Fotos</h2>
  <div class="row"><div class="field"><label>Quantidade</label><select id="qtd"></select></div><div class="field"><label>Layout</label><select id="layout"><option value="auto">Automático</option><option value="grid">Grade</option><option value="vertical">Vertical</option><option value="horizontal">Horizontal</option><option value="destaque">Destaque ao lado</option><option value="destaque_topo">Destaque em cima</option></select></div></div>
  <div class="field"><label>Enviar fotos</label><input id="files" type="file" accept="image/*" multiple></div>
  <div class="field"><label>Modo da foto</label><select id="fit"><option value="contain">Encaixar foto inteira</option><option value="cover">Preencher quadro</option></select></div>
  <div id="thumbs" class="thumbs"></div><input id="singleFilePicker" class="srOnly" type="file" accept="image/*">
  <div class="thumbActions"><button class="btn dark" id="replacePhotoBtn">Trocar foto selecionada</button><button class="btn dark" id="removePhotoBtn">Excluir foto selecionada</button><button class="btn" id="addPhotoBtn">Adicionar foto</button></div>
 </section>
 <section class="panel" data-step="2"><h2>3. Ajustes da foto</h2>
  <div id="emptyAdjust" class="empty">Selecione uma foto no painel ou toque diretamente em uma foto na prévia.</div>
  <div id="adjustPanel" style="display:none"><div class="rangeLine"><span>Zoom</span><input id="scale" type="range" min="0.7" max="2.8" step="0.01"><b id="scaleVal"></b></div><div class="rangeLine"><span>Horizontal</span><input id="posX" type="range" step="1"><b id="posXVal"></b></div><div class="rangeLine"><span>Vertical</span><input id="posY" type="range" step="1"><b id="posYVal"></b></div><div class="btns"><button class="btn dark" id="resetPhoto">Centralizar foto</button></div></div>
 </section>
 <section class="panel" data-step="3"><h2>4. Descrição e texto</h2>
  <div class="field"><label>Descrição da ação</label><textarea id="descricao" placeholder="Descreva a ação realizada, local, objetivo e resultado."></textarea></div>
  <div class="aiBox"><button class="btn dark" id="improveText">Melhorar texto técnico</button><button class="btn dark" id="makeWhatsapp">Gerar texto para WhatsApp</button></div>
  <div class="waActions"><button class="btn dark" id="copyWaBtn">📋 Copiar texto</button></div><p class="waPreview" id="waText"></p>
 </section>
 <section class="panel" data-step="4"><h2>5. Revisão</h2>
  <div id="reviewList" class="warnList"></div><div class="btns" style="margin-top:10px"><button class="btn green" id="saveBtn">Revisar e gerar imagem</button><button class="btn red" id="clearBtn">Limpar</button></div>
  <div id="downloadBox" class="downloadBox"><img id="resultImg"><div class="btns"><button class="btn green" id="shareBtn">Compartilhar imagem</button><button class="btn dark" id="downloadBtn2">Baixar imagem</button></div></div>
 </section>
</aside>
<main class="main">
 <div class="topbar"><div><strong>Pré-visualização</strong><br><span id="status">Pronto para editar</span></div></div>
 <section class="previewWrap"><div class="pageShell"><div id="report"><img class="bg" src="assets/asset-01-facb81df61.webp"><img class="selo" src="assets/asset-02-b1972c0f91.png"><div class="headerForm" id="headerForm"></div><div class="slotLayer" id="slotLayer"></div><div class="descBox" id="descBox"></div><div class="barLine"></div><img class="logo" src="assets/asset-03-d6b699fd84.png"></div></div></section>
</main>
</div>
<div class="mobileBar"><button class="btn dark" id="prevStep">Voltar</button><button class="btn dark" id="previewStep">Prévia</button><button class="btn" id="nextStep">Avançar</button></div>
<div class="toast" id="toast"></div>
<script>
(()=>{"use strict";
const ASSETS={"fundo": "assets/asset-01-facb81df61.webp", "logo": "assets/asset-03-d6b699fd84.png", "selo": "assets/asset-02-b1972c0f91.png"};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ids=['obra','resp','data','gestorContrato','gestorVale','coordVale','gerencia','descricao'], MAX=9, DRAFT='fr_ssma_light_v25';
let state={step:0,qtd:4,layout:'auto',fit:'contain',photos:[],active:0,result:null};
const labels={obra:'Obra:',resp:'Responsável:',data:'Data:',gestorContrato:'Gestor do Contrato:',gestorVale:'Gestor Vale:',coordVale:'Coordenação Vale:',gerencia:'Gerência:'};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2300)}
function status(m){const s=$('#status');if(s)s.textContent=m}
function field(id){return ($('#'+id)?.value||'').trim()}
function brDate(v){if(!v)return'';const [y,m,d]=v.split('-');return d&&m&&y?`${d}/${m}/${y}`:v}
function slug(v){return String(v||'report').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,50)||'report'}
function tipo(){return document.querySelector('input[name="tipoAcao"]:checked')?.value||'DSS / DSS ESPECIAL'}
function tipoObra(){return document.querySelector('input[name="tipoObra"]:checked')?.value||'privada'}
function isObraPublica(){return tipoObra()==='publica'}
function headerEntries(){return Object.entries(labels).filter(([id])=>!isObraPublica()||!['gestorVale','coordVale','gerencia'].includes(id))}
function updateObraMode(){const hide=isObraPublica();document.querySelectorAll('[data-private-only]').forEach(el=>el.style.display=hide?'none':'')}
function tipoMark(nome){return tipo()===nome?'X':' '}
function getWaText(){return `Flash Report SSMA

(${tipoMark('AÇÃO')}) AÇÃO
(${tipoMark('CAMPANHA')}) CAMPANHA
(${tipoMark('DSS / DSS ESPECIAL')}) DSS/DSS ESPECIAL
(${tipoMark('TREINAMENTO')}) TREINAMENTO
(${tipoMark('QUARTA SEGURA')}) QUARTA SEGURA
(${tipoMark('AUDITORIA')}) AUDITORIA
(${tipoMark('INSPEÇÃO')}) INSPEÇÃO
(${tipoMark('DQS')}) DQS
 
🏭 Obra: ${field('obra')||'Não informado'}
👷 Responsável: ${field('resp')||'Não informado'}
📅 Data: ${brDate(field('data'))||'Não informada'}
⛑️ Ação: ${field('descricao')||'Não informada'}`}
function updateWa(){const el=$('#waText'); if(el) el.textContent=getWaText()}
async function copyWa(show=true){updateWa();try{await navigator.clipboard.writeText(getWaText());if(show)toast('Texto copiado')}catch(e){if(show)toast('Copie o texto manualmente')}}
function saveDraft(){try{localStorage.setItem(DRAFT,JSON.stringify({fields:Object.fromEntries(ids.map(id=>[id,$('#'+id)?.value||''])),qtd:state.qtd,layout:state.layout,fit:state.fit,tipo:tipo(),tipoObra:tipoObra()}))}catch(e){}}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem(DRAFT)||'{}'); if(d.fields)ids.forEach(id=>{if($('#'+id))$('#'+id).value=d.fields[id]||''}); state.qtd=d.qtd||4; state.layout=d.layout||'auto'; state.fit=d.fit||'contain'; if(d.tipo){const el=document.querySelector(`input[name="tipoAcao"][value="${d.tipo}"]`);if(el)el.checked=true} if(d.tipoObra){const el=document.querySelector(`input[name="tipoObra"][value="${d.tipoObra}"]`);if(el)el.checked=true}}catch(e){}}
function init(){for(let i=1;i<=MAX;i++)$('#qtd').insertAdjacentHTML('beforeend',`<option value="${i}">${i}</option>`); if(!$('#data').value)$('#data').value=new Date().toISOString().slice(0,10); loadDraft(); $('#qtd').value=state.qtd; $('#layout').value=state.layout; $('#fit').value=state.fit; bind(); render();}
function bind(){ids.forEach(id=>$('#'+id)?.addEventListener('input',()=>{state.result=null;saveDraft();render()})); document.querySelectorAll('input[name="tipoAcao"]').forEach(el=>el.onchange=()=>{state.result=null;saveDraft();updateWa();render()}); document.querySelectorAll('input[name="tipoObra"]').forEach(el=>el.onchange=()=>{state.result=null;saveDraft();render()});
['qtd','layout','fit'].forEach(id=>$('#'+id).onchange=e=>{if(id==='qtd'){state.qtd=+e.target.value;if(state.photos.length>state.qtd)state.photos=state.photos.slice(0,state.qtd);if(state.active>=state.qtd)state.active=state.qtd-1}else{state[id]=e.target.value;if(id==='fit')state.photos.forEach(p=>p&&(p.fit=state.fit))}state.result=null;saveDraft();render()});
$('#files').onchange=handleFiles; $('#singleFilePicker').onchange=handleOne; $('#replacePhotoBtn').onclick=()=>pick(state.active); $('#addPhotoBtn').onclick=()=>pick(Math.min(state.qtd,MAX-1)); $('#removePhotoBtn').onclick=()=>removePhoto(state.active); $('#resetPhoto').onclick=resetPhoto;
['scale','posX','posY'].forEach(id=>$('#'+id).oninput=e=>{const p=state.photos[state.active];if(!p)return;if(id==='scale')p.scale=+e.target.value;if(id==='posX')p.x=+e.target.value;if(id==='posY')p.y=+e.target.value;boundPhoto(state.active);state.result=null;render()});
$('#improveText').onclick=improveText; $('#makeWhatsapp').onclick=()=>copyWa(); $('#copyWaBtn').onclick=()=>copyWa(); $('#saveBtn').onclick=capture; $('#downloadBtn2').onclick=download; $('#shareBtn').onclick=shareImage; $('#clearBtn').onclick=clearAll; $('#prevStep').onclick=()=>setStep(Math.max(0,state.step-1)); $('#nextStep').onclick=()=>setStep(state.step>=4?0:state.step+1); $('#previewStep').onclick=()=>$('.previewWrap').scrollIntoView({behavior:'smooth',block:'start'}); window.onresize=render;}
function setStep(n){state.step=n;renderSteps();if(n===4)renderReview()}
function renderSteps(){$('#steps').innerHTML='';for(let i=0;i<5;i++){const d=document.createElement('div');d.className='dot'+(i<=state.step?' on':'');$('#steps').appendChild(d)}$$('.panel').forEach(p=>p.classList.toggle('active',+p.dataset.step===state.step));$('#prevStep').disabled=state.step===0;$('#nextStep').textContent=state.step>=4?'Início':'Avançar'}
async function resizeFile(file,max=1600){return new Promise(res=>{const img=new Image(),fr=new FileReader();fr.onload=()=>{img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*r),h=Math.round(img.height*r),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>res({url:URL.createObjectURL(b),name:file.name,w,h}),'image/jpeg',.86)};img.src=fr.result};fr.readAsDataURL(file)})}
async function handleFiles(e){clearPhotoUrls();const fs=[...e.target.files].slice(0,MAX);if(!fs.length)return;status('Otimizando fotos...');state.photos=[];for(const f of fs)state.photos.push(await resizeFile(f));state.photos.forEach(p=>Object.assign(p,{scale:1,x:0,y:0,fit:state.fit}));state.qtd=Math.max(1,state.photos.length);$('#qtd').value=state.qtd;state.active=0;state.result=null;render();status(`${fs.length} foto(s) carregada(s)`)}
async function handleOne(e){const f=e.target.files?.[0];if(!f)return;const i=Math.min(MAX-1,+e.target.dataset.index||state.active);const old=state.photos[i]; if(old?.url)URL.revokeObjectURL(old.url); const p=await resizeFile(f);state.photos[i]={...p,scale:1,x:0,y:0,fit:state.fit};state.qtd=Math.max(state.qtd,i+1);$('#qtd').value=state.qtd;state.active=i;state.result=null;render()}
function pick(i){const p=$('#singleFilePicker');p.dataset.index=i;p.value='';p.click()}
function removePhoto(i){if(!state.photos[i])return;URL.revokeObjectURL(state.photos[i].url);state.photos.splice(i,1);state.qtd=Math.max(1,state.photos.length||1);$('#qtd').value=state.qtd;state.active=Math.min(state.active,state.qtd-1);state.result=null;render();toast('Foto removida')}
function clearPhotoUrls(){state.photos.forEach(p=>p?.url&&URL.revokeObjectURL(p.url))}
function clearAll(){if(!confirm('Limpar tudo?'))return;clearPhotoUrls();ids.forEach(id=>{if($('#'+id))$('#'+id).value=''});$('#data').value=new Date().toISOString().slice(0,10);const tipoDefault=document.querySelector('input[name="tipoAcao"][value="DSS / DSS ESPECIAL"]'); if(tipoDefault) tipoDefault.checked=true; const obraDefault=document.querySelector('input[name="tipoObra"][value="privada"]'); if(obraDefault) obraDefault.checked=true; state={step:0,qtd:4,layout:'auto',fit:'contain',photos:[],active:0,result:null};$('#qtd').value=4;$('#layout').value='auto';$('#fit').value='contain';$('#files').value='';$('#downloadBox').classList.remove('on');localStorage.removeItem(DRAFT);setStep(0);render();toast('Tudo foi limpo')}
function layoutFor(q,mode){const a={x:7.2,y:18.2,w:85.6,h:64},g=1.8;if(mode==='destaque'&&q>1){let s=q-1,rw=a.w*.34;return [{x:a.x,y:a.y,w:a.w-rw-g,h:a.h},...Array.from({length:s},(_,i)=>({x:a.x+a.w-rw,y:a.y+i*((a.h-(s-1)*g)/s+g),w:rw,h:(a.h-(s-1)*g)/s}))]}if(mode==='destaque_topo'&&q>1){let s=q-1,th=a.h*.58,by=a.y+th+g,bh=a.h-th-g,cols=s<=4?s:4,rows=Math.ceil(s/cols),cw=(a.w-(cols-1)*g)/cols,ch=(bh-(rows-1)*g)/rows;return [{x:a.x,y:a.y,w:a.w,h:th},...Array.from({length:s},(_,i)=>({x:a.x+(i%cols)*(cw+g),y:by+Math.floor(i/cols)*(ch+g),w:cw,h:ch}))]}if(mode==='vertical'&&q<=4)return Array.from({length:q},(_,i)=>({x:a.x+i*((a.w-(q-1)*g)/q+g),y:a.y,w:(a.w-(q-1)*g)/q,h:a.h}));if(mode==='horizontal'&&q<=4)return Array.from({length:q},(_,i)=>({x:a.x,y:a.y+i*((a.h-(q-1)*g)/q+g),w:a.w,h:(a.h-(q-1)*g)/q}));const cols=q===1?1:q===2?2:q<=4?2:3,rows=Math.ceil(q/cols),cw=(a.w-(cols-1)*g)/cols,ch=(a.h-(rows-1)*g)/rows;return Array.from({length:q},(_,i)=>({x:a.x+(i%cols)*(cw+g),y:a.y+Math.floor(i/cols)*(ch+g),w:cw,h:ch}))}
function render(){state.qtd=+$('#qtd').value||state.qtd;state.layout=$('#layout').value;state.fit=$('#fit').value;updateObraMode();renderSteps();renderHeader();renderSlots();renderThumbs();renderDesc();renderAdjust();renderReview(false);updateWa()}
function renderHeader(){const h=$('#headerForm');h.innerHTML='';headerEntries().forEach(([id,lab])=>{const val=id==='data'?brDate(field(id)):field(id);const r=document.createElement('div');r.className='headRow';const l=document.createElement('span');l.className='label';l.textContent=lab;const b=document.createElement('span');b.className='headBox';b.textContent=val||' ';r.append(l,b);h.appendChild(r)})}
function renderSlots(){const layer=$('#slotLayer');layer.innerHTML='';const reportEl=$('#report');layoutFor(state.qtd,state.layout).forEach((l,i)=>{const p=state.photos[i],s=document.createElement('div');s.className='slot'+(i===state.active?' active':'');s.dataset.i=i;s.style.cssText=`left:${l.x}%;top:${l.y}%;width:${l.w}%;height:${l.h}%;border-radius:${Math.max(10,Math.min(l.w,l.h)*.8)}px`;if(p){boundPhoto(i);s.innerHTML=`<img src="${p.url}"><span class="num">${i+1}</span>`;const img=s.querySelector('img');const slotW=(reportEl?.clientWidth||790)*l.w/100,slotH=(reportEl?.clientHeight||988)*l.h/100;const mode=p.fit||state.fit;const base=mode==='contain'?Math.min(slotW/p.w,slotH/p.h):Math.max(slotW/p.w,slotH/p.h);const sc=base*(p.scale||1);const dw=p.w*sc,dh=p.h*sc;img.style.width=dw+'px';img.style.height=dh+'px';img.style.left=((slotW-dw)/2 + (p.x||0))+'px';img.style.top=((slotH-dh)/2 + (p.y||0))+'px';}else s.innerHTML=`<div class="hint">FOTO ${i+1}</div><span class="num">${i+1}</span>`;s.onpointerdown=startDrag;s.onclick=()=>selectPhoto(i);layer.appendChild(s)})}
let drag=null;function startDrag(e){const i=+e.currentTarget.dataset.i;selectPhoto(i);const p=state.photos[i];if(!p)return;drag={i,sx:e.clientX,sy:e.clientY,ox:p.x||0,oy:p.y||0};e.currentTarget.setPointerCapture(e.pointerId)}window.addEventListener('pointermove',e=>{if(!drag)return;const p=state.photos[drag.i];p.x=drag.ox+(e.clientX-drag.sx);p.y=drag.oy+(e.clientY-drag.sy);boundPhoto(drag.i);state.result=null;renderSlots();renderAdjust()});window.addEventListener('pointerup',()=>{if(drag){saveDraft();drag=null}});
function selectPhoto(i){state.active=i;if(state.step<2)setStep(2);render()}
function slotSize(i){const el=$('#report'),l=layoutFor(state.qtd,state.layout)[i]||layoutFor(state.qtd,state.layout)[0];return {w:(el?.clientWidth||790)*l.w/100,h:(el?.clientHeight||988)*l.h/100}}
function limits(i){const p=state.photos[i];if(!p)return{x:0,y:0};const s=slotSize(i),mode=(p.fit||state.fit),base=mode==='contain'?Math.min(s.w/p.w,s.h/p.h):Math.max(s.w/p.w,s.h/p.h),sc=base*(p.scale||1),dw=p.w*sc,dh=p.h*sc;return{x:Math.abs(dw-s.w)/2,y:Math.abs(dh-s.h)/2,dw,dh,slotW:s.w,slotH:s.h,mode}}
function boundPhoto(i){const p=state.photos[i];if(!p)return;const m=limits(i);p.x=Math.max(-m.x,Math.min(m.x,p.x||0));p.y=Math.max(-m.y,Math.min(m.y,p.y||0))}
function renderThumbs(){const t=$('#thumbs');t.innerHTML='';for(let i=0;i<state.qtd;i++){const p=state.photos[i],d=document.createElement('div');d.className='thumb'+(i===state.active?' active':'');d.innerHTML=p?`<img src="${p.url}"><button class="thumbMain" aria-label="Selecionar foto"></button><button class="thumbNum">${i+1}</button><button class="thumbRemove">×</button><span class="thumbLabel">Selecionar</span>`:`<button class="thumbMain" aria-label="Inserir foto"></button><span class="hint">${i+1}</span><button class="thumbNum">${i+1}</button><span class="thumbLabel">Inserir foto</span>`;d.querySelector('.thumbMain').onclick=()=>p?selectPhoto(i):pick(i);d.querySelector('.thumbNum').onclick=e=>{e.stopPropagation();pick(i)};d.querySelector('.thumbRemove')?.addEventListener('click',e=>{e.stopPropagation();removePhoto(i)});t.appendChild(d)}if(state.qtd<MAX){const add=document.createElement('button');add.className='thumb';add.innerHTML='<span class="hint">+ Adicionar</span>';add.onclick=()=>pick(state.qtd);t.appendChild(add)}}
function renderDesc(){const box=$('#descBox'),d=field('descricao');box.style.display=d?'block':'none';box.textContent=d;box.style.height=(state.qtd>=5?9.5:10.2)+'%';box.style.top=(state.qtd>=5?84.9:84.58)+'%';requestAnimationFrame(()=>{let s=Math.max(12,Math.min(box.clientWidth/17,box.clientHeight/1.85));box.style.fontSize=s+'px';while((box.scrollHeight>box.clientHeight||box.scrollWidth>box.clientWidth)&&s>11){s-=.5;box.style.fontSize=s+'px'}})}
function renderAdjust(){const p=state.photos[state.active];$('#emptyAdjust').style.display=p?'none':'block';$('#adjustPanel').style.display=p?'block':'none';if(!p)return;boundPhoto(state.active);const m=limits(state.active),xr=$('#posX'),yr=$('#posY');xr.min=-Math.ceil(m.x);xr.max=Math.ceil(m.x);yr.min=-Math.ceil(m.y);yr.max=Math.ceil(m.y);xr.disabled=m.x<1;yr.disabled=m.y<1;$('#scale').value=p.scale||1;xr.value=p.x||0;yr.value=p.y||0;$('#scaleVal').textContent=(p.scale||1).toFixed(2)+'x';$('#posXVal').textContent=Math.round(p.x||0);$('#posYVal').textContent=Math.round(p.y||0)}
function resetPhoto(){const p=state.photos[state.active];if(p){p.scale=1;p.x=0;p.y=0;state.result=null;render()}}
function reviewItems(){return [['Obra',field('obra')],['Responsável',field('resp')],['Data',field('data')],['Descrição',field('descricao')]].map(([n,v])=>({ok:!!v,txt:v?`${n} preenchido`:`${n} não preenchido`})).concat([{ok:state.photos.some(Boolean),txt:state.photos.some(Boolean)?'Fotos carregadas':'Nenhuma foto carregada'}])}
function renderReview(){const r=$('#reviewList');if(!r)return;r.innerHTML='';reviewItems().forEach(i=>{const d=document.createElement('div');d.className='warn '+(i.ok?'ok':'bad');d.textContent=(i.ok?'✓ ':'! ')+i.txt;r.appendChild(d)})}
function improveText(){const raw=field('descricao');if(!raw)return toast('Digite uma descrição primeiro');const obra=field('obra'),txt=raw.replace(/\s+/g,' ').trim().replace(/^Foi realizada ação de SSMA[:,]?\s*/i,'');$('#descricao').value=`Foi realizada ação de SSMA${obra?' na obra '+obra:''}, contemplando ${txt.charAt(0).toLowerCase()+txt.slice(1)}. A iniciativa contribui para a melhoria das condições de segurança, organização da área e fortalecimento das boas práticas operacionais.`;state.result=null;saveDraft();render();toast('Texto melhorado')}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
function rounded(ctx,x,y,w,h,r){r=Math.max(0,Math.min(r,Math.min(w,h)/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function rect(ctx,x,y,w,h,r,fill){rounded(ctx,x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()}
function wrap(ctx,text,w){const words=String(text||'').split(/\s+/).filter(Boolean),lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width<=w)line=test;else{if(line)lines.push(line);line=word}}if(line)lines.push(line);return lines}
function drawFitText(ctx,text,x,y,w,h,max=28,min=13){let s=max,lines=[];do{ctx.font=`400 ${s}px "Century Gothic",Arial`;lines=wrap(ctx,text,w);if(lines.length*s*1.15<=h)break;s--}while(s>min);ctx.fillStyle='#fff';ctx.textBaseline='top';let yy=y;for(const l of lines){if(yy+s>y+h)break;ctx.fillText(l,x,yy);yy+=s*1.15}}
function fitLine(ctx,text,w,start=25,min=14){let s=start;do{ctx.font=`400 ${s}px "Century Gothic",Arial`;if(ctx.measureText(text).width<=w)break;s--}while(s>min);return s}
function drawPhoto(ctx,img,x,y,w,h,p,i){rect(ctx,x,y,w,h,Math.max(18,Math.min(w,h)*.045),'#eef4f7');if(!img)return;ctx.save();rounded(ctx,x,y,w,h,Math.max(18,Math.min(w,h)*.045));ctx.clip();const mode=p.fit||state.fit,base=mode==='contain'?Math.min(w/img.width,h/img.height):Math.max(w/img.width,h/img.height),sc=base*(p.scale||1),dw=img.width*sc,dh=img.height*sc,slot=slotSize(i),rx=w/slot.w,ry=h/slot.h,mx=Math.abs(dw-w)/2,my=Math.abs(dh-h)/2,moveX=Math.max(-mx,Math.min(mx,(p.x||0)*rx)),moveY=Math.max(-my,Math.min(my,(p.y||0)*ry)),dx=x+(w-dw)/2+moveX,dy=y+(h-dh)/2+moveY;ctx.drawImage(img,dx,dy,dw,dh);ctx.restore()}
async function exportCanvas(){const W=1638,H=2048,c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=W;c.height=H;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';const [bg,selo,logo]=await Promise.all([loadImg(ASSETS.fundo),loadImg(ASSETS.selo),loadImg(ASSETS.logo)]);ctx.drawImage(bg,0,0,W,H);const sw=W*.432,sh=sw*selo.height/selo.width;ctx.drawImage(selo,W*.069,H*.0555,sw,sh);let hx=W*.57,hy=H*.0235,right=W*.97,rowH=31,gap=8;headerEntries().forEach(([id,lab],i)=>{const val=id==='data'?brDate(field(id)):field(id),y=hy+i*(rowH+gap);ctx.font='400 27px "Century Gothic",Arial';ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,44,77,.55)';ctx.shadowBlur=2;ctx.shadowOffsetY=2;ctx.textBaseline='middle';ctx.fillText(lab,hx,y+rowH/2);const lw=ctx.measureText(lab).width,bx=hx+lw+14,bh=26,bw=Math.min(Math.max(100,ctx.measureText(val||'').width+28),Math.max(90,right-bx));rect(ctx,bx,y+(rowH-bh)/2,bw,bh,4,'#1886c8');if(val){const fs=fitLine(ctx,val,bw-24);ctx.font=`400 ${fs}px "Century Gothic",Arial`;ctx.fillStyle='#fff';ctx.fillText(val,bx+12,y+rowH/2)}});ctx.shadowColor='transparent';const lay=layoutFor(state.qtd,state.layout);for(let i=0;i<lay.length;i++){const l=lay[i],p=state.photos[i];let img=null;if(p)img=await loadImg(p.url);drawPhoto(ctx,img,W*l.x/100,H*l.y/100,W*l.w/100,H*l.h/100,p||{},i)}const desc=field('descricao');if(desc){const x=W*.072,y=H*.8458,w=W*.64,h=H*(state.qtd>=5?.095:.102);rect(ctx,x,y,w,h,34,'rgba(13,117,173,.9)');ctx.shadowColor='rgba(0,53,83,.55)';ctx.shadowBlur=2;ctx.shadowOffsetY=2;drawFitText(ctx,desc,x+Math.max(26,w*.03),y+Math.max(20,h*.18),w-Math.max(52,w*.06),h-Math.max(40,h*.36));ctx.shadowColor='transparent'}rect(ctx,W*.064,H*.9758,W*(1-.064-.072),H*.0045,5,'#1179b2');rect(ctx,W*.064,H*.9758,W*.051,H*.0045,5,'#f31318');const lw=W*.186,lh=lw*logo.height/logo.width;ctx.drawImage(logo,W*(1-.078)-lw,H*(1-.038)-lh,lw,lh);return c}
async function capture(){try{setStep(4);renderReview();const bad=reviewItems().filter(i=>!i.ok).map(i=>i.txt);if(bad.length&&!confirm('Existem pontos pendentes:\n\n'+bad.join('\n')+'\n\nDeseja gerar mesmo assim?'))return;status('Gerando imagem...');const url=(await exportCanvas()).toDataURL('image/png',1);state.result=url;$('#resultImg').src=url;$('#downloadBox').classList.add('on');await copyWa(false);status('Imagem pronta');toast('Imagem gerada')}catch(e){console.error(e);toast('Erro ao gerar imagem');status('Erro ao gerar imagem')}}
function download(){if(!state.result)return;fetch(state.result).then(r=>r.blob()).then(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`Flash_Report_SSMA_${slug(field('obra'))}_${field('data')||new Date().toISOString().slice(0,10)}.png`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},500);toast('Download iniciado')})}
async function shareImage(){if(!state.result)await capture();if(!state.result)return;try{const blob=await(await fetch(state.result)).blob(),file=new File([blob],`Flash_Report_SSMA_${slug(field('obra'))}.png`,{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}))return navigator.share({files:[file],title:'Flash Report SSMA'})}catch(e){}download();toast('Imagem baixada para compartilhar')}
init();
})();
